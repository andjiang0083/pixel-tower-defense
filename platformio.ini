; ============================================================================
;  PIXEL TOWER DEFENSE — M5Stack Tab5 (ESP32-P4)
; ----------------------------------------------------------------------------
;  ⚠️ 关于「选择 Tab5 开发板」的正确姿势（重要，别按 SPI 屏的思路找菜单）：
;
;   Tab5 的屏幕是 **MIPI DSI**（面板 ILI9881C / ST7123），不是 SPI/QSPI。
;   ESP32-P4 的 DSI 控制器只支持 Video Mode：帧缓冲常驻 PSRAM，由 DMA
;   连续扫描输出。因此不存在「把矩形命令写进屏幕 GRAM」的通路，
;   **TFT_eSPI 无法驱动 Tab5**（它只实现了 SPI 总线的写时序）。
;   上游佐证：Bodmer/TFT_eSPI issue #3719。
;
;   Tab5 在 Arduino 生态下唯一可用的显示通路是 M5GFX（LovyanGFX 分支），
;   它内部用 ESP-IDF 官方 esp_lcd/DSI + GT911 触摸驱动。本项目的
;   「游戏画面」全部由 fillRect / drawPixel 手画，不加载任何图片/位图资源，
;   连数字字母都是自带的 5×7 像素点阵（见 pixel_font.h）。
;
;   → 不要用 Arduino IDE + TFT_eSPI。用 PlatformIO（pioarduino），板子选
;     esp32-p4-evboard，靠 -DARDUINO_M5STACK_TAB5 让 M5GFX 命中 Tab5 配置。
;
;  构建 / 烧录：
;     pio run -e tab5              # 编译
;     pio run -e tab5 -t upload    # 烧录（USB-C）
;     pio device monitor           # 看日志
; ============================================================================

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-p4-evboard
board_build.mcu = esp32p4
; pioarduino 55.03.39 的板定义写的是 chip_variant=esp32p4_es（ES 片），
; bmorcelli 预编译 libs 只带 esp32p4/ —— 不覆盖会报 missing SConscript
board_build.chip_variant = esp32p4
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.f_cpu = 360000000L
board_build.f_psram = 200000000L
board_build.img_freq = 40m            ; DSI 时钟
board_build.partitions = app3M_fat9M_16MB.csv
board_build.psram = enable           ; Tab5 必须开 PSRAM（帧缓冲所在地）
board_build.psram_mode = oct
upload_speed = 1500000
monitor_speed = 115200
framework = arduino

build_flags =
    -DARDUINO_M5STACK_TAB5
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I src
    ; ⚠️ v0.5.0 起生成物按 profile 分目录：config_gen.h 在 build/<profile>/，
    ;    不再放进 src/（见 .gitignore 的说明）。少了这一行，固件编不过
    ;    （fatal error: 'config_gen.h' file not found）。
    -I build/tab5

build_src_filter = +<*>

lib_deps =
    ; ⚠️ 依赖钉到精确版本（含传递依赖）：M5Unified 只锁自己，它声明的 M5GFX 仍会
    ; 飘到最新 → 别人克隆构建出来的固件和你发布的那份不是同一个。
    ; 实测本机参与编译的是 M5Unified 0.2.25 + M5GFX 0.2.32。
    ; M5Unified 提供 M5.Display / M5.Touch（Tab5: DSI 面板 + GT911/ST7123 触控）
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32

; 定制 libs：支持 PSRAM 200MHz OPI（Tab5 的 Octal PSRAM）
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.10/esp32-core-3.3.10.zip
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/launcher_tab5_esp32-arduino-libs-20260519-233957.tar.xz
