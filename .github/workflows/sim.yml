name: sim

# 门禁：PC 仿真（编译真固件源码）+ 三个确定生成物的漂移检查 + 中文字库的语义覆盖检查。
# 仿真是本项目唯一的自动化测试（真机不便接入 CI），任何 PR 不得让它变红。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PC simulator — real firmware sources, all assertions
        run: |
          g++ -std=c++17 -O2 -I sim/compat -I src sim/run.cpp -o sim/sim
          ./sim/sim

      # 单一真源纪律：改生成器必须重新生成，且生成结果必须入库
      - name: config_gen.h must match tools/layout.py
        run: |
          python3 tools/layout.py
          git diff --exit-code src/config_gen.h

      - name: pixel_font.h must match tools/gen_font.py
        run: |
          python3 tools/gen_font.py
          git diff --exit-code src/pixel_font.h

      - name: sfx_data.h must match tools/gen_sfx.py
        run: |
          python3 tools/gen_sfx.py
          git diff --exit-code src/sfx_data.h

      # v0.4.2：中文字库。为什么不是字节级漂移：点阵由 Pillow+FreeType 光栅化外部
      # 字体得到，字体/FreeType/Pillow 任一不同（换平台、换字体、升级依赖）都会
      # 得到不同的字节——实测同一台机器上 STHeiti 与 Hiragino 渲染结果即不同，
      # v0.4.2 首次推送时 CI 就是这样红的。所以这里查跨平台恒成立的语义不变量：
      # 字库必须精确覆盖 i18n.h 的汉字集（增删中文文案忘重跑 → 红）。
      # 字节一致性是维护机纪律：改 i18n.h 中文 → 用同一字体重跑 gen_cnfont.py
      # → git diff 必须为空（纯 stdlib，无需 Pillow）。
      - name: cn_font.h must cover every CJK char in i18n.h
        run: |
          python3 tools/check_cnfont.py
